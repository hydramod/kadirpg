<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Infra</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #0f172a;
      --bg-accent: #1e293b;
      --card: rgba(255, 255, 255, 0.9);
      --primary: #38bdf8;
      --primary-strong: #0ea5e9;
      --text: #0f172a;
      --muted: #64748b;
    }
    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #38bdf820, transparent 55%),
        linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      max-width: 520px;
      width: 100%;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.3);
      animation: float-in 0.8s ease-out;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-strong);
      background: rgba(14, 165, 233, 0.12);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 rgba(56, 189, 248, 0.4);
      animation: pulse 2s infinite;
    }
    h1 {
      margin: 1rem 0 0.5rem;
      font-size: 2rem;
      font-weight: 700;
    }
    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    pre {
      background: linear-gradient(145deg, #0f172a, #1e293b);
      color: #e2e8f0;
      padding: 1.25rem;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      overflow-x: auto;
      transition: transform 0.3s ease;
    }
    pre:hover {
      transform: translateY(-2px);
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
    }
    .status span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.8);
    }
    @keyframes float-in {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(56, 189, 248, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="badge">
        <span class="pulse-dot"></span>
        Live App
      </div>
      <div class="status"><span></span>Online</div>
    </div>
    <h1>Hello Infra</h1>
    <p class="subtitle">A clean, modern UI surface for the backend JSON response.</p>
    <pre id="result">Loading...</pre>
    <div class="meta">
      <span>Powered by Spring Boot</span>
      <span id="timestamp">Fetching...</span>
    </div>
  </div>

  <script>
    const fallbackPayload = {
      app: "hello-infra",
      version: "1.0",
      env: "dev"
    };

    const result = document.getElementById("result");
    const timestamp = document.getElementById("timestamp");

    const renderPayload = (payload, note) => {
      result.textContent = JSON.stringify(payload, null, 2);
      timestamp.textContent = note;
    };

    fetch("/")
      .then((response) => response.json())
      .then((data) => {
        renderPayload(data, "Synced just now");
      })
      .catch((error) => {
        renderPayload(fallbackPayload, "Offline preview");
        console.error(error);
      });
  </script>
</body>
</html>
